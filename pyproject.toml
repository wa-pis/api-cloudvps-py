[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-cloudvps-py"
version = "0.2.0"
description = "Unofficial Python client for the REG.Cloud CloudVPS API"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anton Grudin"}]
keywords = ["api", "cloud", "cloudvps", "reg.cloud", "reg.ru"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.34.2,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "ruff>=0.12",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/wa-pis/api-cloudvps-py"
Repository = "https://github.com/wa-pis/api-cloudvps-py"
Issues = "https://github.com/wa-pis/api-cloudvps-py/issues"
Documentation = "https://developers.cloudvps.reg.ru/"

[tool.setuptools.packages.find]
include = ["cloudvps*"]

[tool.setuptools.package-data]
cloudvps = ["endpoints.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
